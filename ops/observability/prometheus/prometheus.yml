global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flacaud-api
    metrics_path: /internal/metrics/prometheus
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
