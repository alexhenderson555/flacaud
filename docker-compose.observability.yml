# Optional observability overlay (Prometheus + Loki + Promtail + Grafana).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Grafana: SSH tunnel → http://127.0.0.1:3000 (admin / GRAFANA_ADMIN_PASSWORD)
# Or expose via Caddy — see ops/observability/README.md

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Rendered from alertmanager.yml.template at deploy time (see
      # scripts/repair_servers.py _render_alertmanager_config) -- the real
      # SMTP password can't live in the git-tracked template.
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./ops/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./ops/observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Reuses the app's own Resend account as an SMTP relay (Resend supports
      # SMTP alongside its REST API) -- no separate mail provider needed just
      # for alert delivery. Alert rules already exist (ops/prometheus/alerts.yml)
      # but had no contact point configured, so a firing alert was only ever
      # visible to someone who happened to open Grafana -- never pushed anywhere.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.resend.com:587"
      GF_SMTP_USER: "resend"
      GF_SMTP_PASSWORD: ${RESEND_API_KEY:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_ALERT_FROM:-alerts@flacaud.ru}
      GF_SMTP_FROM_NAME: "FlacAud Alerts"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
