[project]
name = "tidal-dl-ru"
version = "0.1.0"
description = "Tidal downloader (RU-friendly via remote backend)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "mutagen>=1.47",
    "rich>=13.7",
    "platformdirs>=4.2",
    "yt-dlp>=2025.4.30",
    "syncedlyrics>=0.10",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "redis>=5.2",
    "itsdangerous>=2.2",
    "aiogram>=3.10",
    "numpy>=1.26",
    "python-multipart>=0.0.29",
    "shazamapi>=0.0.2",
    "pydub>=0.25.1",
    "google-generativeai>=0.8.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.38",
    "demucs>=4.0.0",
]

[project.optional-dependencies]
dj = [
    "aubio>=0.4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
tidal-dl-ru = "tidal_dl_ru.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal_dl_ru"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
