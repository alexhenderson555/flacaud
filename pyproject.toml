[project]
name = "tidal-dl-ru"
version = "0.1.0"
description = "FlacAud — lossless Tidal player and FLAC downloads"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "mutagen>=1.47",
    "rich>=13.7",
    "platformdirs>=4.2",
    "yt-dlp>=2025.4.30",
    "ytmusicapi>=1.10.3",
    "syncedlyrics>=0.10",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "arq>=0.26",
    "redis>=5.2",
    "itsdangerous>=2.2",
    "aiogram>=3.10",
    "numpy>=1.26",
    "python-multipart>=0.0.29",
    "shazamapi>=0.0.2",
    "pydub>=0.25.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "filelock>=3.13",
    "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
worker = [
    "demucs>=4.0.0",
]
dj = [
    "aubio>=0.4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.26",
    "alembic>=1.13",
    "pip-audit>=2.7",
]

[project.scripts]
tidal-dl-ru = "tidal_dl_ru.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal_dl_ru"]

[tool.hatch.build.targets.wheel.force-include]
"src/tidal_dl_ru/data" = "tidal_dl_ru/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841", "E402", "E701"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F811"]
"src/tidal_dl_ru/server/app.py" = ["E402"]
"scripts/**" = ["E741", "W291", "W293"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.5",
    "alembic>=1.13",
]
