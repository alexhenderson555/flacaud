name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps
        run: uv sync --dev --extra worker

      - name: Ruff
        run: uv run ruff check src scripts

      - name: Pytest
        run: uv run pytest tests/ -q --tb=short -k "not remote_flow_live" --cov=tidal_dl_ru.server --cov=tidal_dl_ru.providers --cov=tidal_dl_ru.core --cov-report=term-missing --cov-fail-under=55

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tidal
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tidaldl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidal -d tidaldl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --dev --extra worker
      - name: Alembic on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://tidal:testpass@localhost:5432/tidaldl
        run: |
          uv run alembic upgrade head
          uv run pytest tests/test_alembic_migrations.py tests/test_match_rules.py -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, test & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run typecheck
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E (full suite)
        working-directory: frontend
        env:
          CI: "true"
        run: npm run e2e -- --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
