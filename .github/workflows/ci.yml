name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps
        run: uv sync --dev --extra worker

      - name: Ruff
        run: uv run ruff check src scripts

      - name: Pytest
        run: uv run pytest tests/ -q --tb=short -k "not remote_flow_live"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Playwright E2E
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm run e2e
