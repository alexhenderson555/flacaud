name: Deploy to Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/tidal-dl-ru
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            cd frontend && npm ci && npm run build && cd ..
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            if grep -q '^TIDAL_USE_POSTGRES=1' .env 2>/dev/null || grep -q '^DATABASE_URL=postgresql' .env 2>/dev/null; then
              COMPOSE="$COMPOSE -f docker-compose.postgres.yml"
            fi
            $COMPOSE build api worker bot
            $COMPOSE up -d --remove-orphans
            $COMPOSE up -d caddy
            $COMPOSE restart caddy api bot
            sleep 15
            DOMAIN="${DOMAIN:-flacaud.ru}"
            curl -sf "https://${DOMAIN}/healthz" | grep -q '"ok": true\|"ok":true' || \
              curl -sf http://127.0.0.1:8001/healthz | grep -q '"ok": true\|"ok":true'
