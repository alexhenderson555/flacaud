name: Deploy to Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (with rollback on health failure)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          # Forward the OAuth app credentials into the SSH session so `docker
          # compose up` can interpolate them (compose reads ${SPOTIPY_*}/${GOOGLE_*}
          # from the shell env). Without this only GH_TOKEN reached the server and
          # the connected-account connectors stayed dormant (configured=false).
          envs: GH_TOKEN,SPOTIPY_CLIENT_ID,SPOTIPY_CLIENT_SECRET,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET
          # 30 minutes — the build pulls node:22-alpine for frontend, then
          # docker compose build api worker bot (uv sync + torch/demucs for
          # worker). On a VPS this takes ~15-20 min on first deploy, ~5 min
          # on subsequent (cached layers). The default 10m is too tight.
          command_timeout: 30m
          # Capture the previous HEAD before deploy so we can roll back if the
          # post-deploy health check fails. Tag the deploy with the commit SHA
          # via a git tag (deploy-<sha>) for auditability.
          script: |
            set -euo pipefail
            DEPLOY_PATH="/opt/tidal-dl-ru"
            # Use the x-access-token user with the GitHub token for authenticated
            # clone/fetch — the repo is private, so anonymous HTTPS prompts for
            # credentials and fails in non-interactive SSH.
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/alexhenderson555/flacaud.git"
            REF="${{ steps.meta.outputs.ref }}"

            # Clone the repo if it doesn't exist yet (first CI-based deploy).
            # Previously the server was deployed via tar+SCP, so /opt/tidal-dl-ru
            # may exist without a .git directory. In that case, back it up and
            # clone fresh — .env is preserved from the backup.
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "No git repo at $DEPLOY_PATH — cloning fresh"
              if [ -d "$DEPLOY_PATH" ]; then
                mv "$DEPLOY_PATH" "${DEPLOY_PATH}.backup.$(date +%s)"
              fi
              git clone "$REPO_URL" "$DEPLOY_PATH"
              # Restore .env from backup if it existed
              if ls "${DEPLOY_PATH}.backup."*/.env 1>/dev/null 2>&1; then
                cp "${DEPLOY_PATH}.backup."*/.env "$DEPLOY_PATH/.env"
                echo "Restored .env from backup"
              fi
            fi

            cd "$DEPLOY_PATH"
            # Update the remote URL with the current token (tokens expire).
            git remote set-url origin "$REPO_URL"
            PREV_HEAD="$(git rev-parse HEAD)"
            SHA="${{ steps.meta.outputs.sha }}"
            echo "Deploying $SHA (was $PREV_HEAD)"

            git fetch origin
            git reset --hard "origin/$REF"

            # Build the frontend inside a Docker container — the server has
            # Docker but no Node.js. The old tar deploy shipped a pre-built
            # dist/; now we build it on-server via a throwaway node container.
            echo "Building frontend via Docker..."
            docker run --rm -v "$DEPLOY_PATH/frontend:/app" -w /app node:22-alpine sh -c "npm ci && npm run build"

            # Prune old/dangling Docker images to free disk space before the
            # build — the worker image (torch + demucs ~2GB) from the previous
            # Stem Splitter deploy fills the disk. Safe: only removes dangling
            # images, not running containers.
            docker system prune -f --filter "until=1h" || true
            docker image prune -f || true

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            if grep -q '^TIDAL_USE_POSTGRES=1' .env 2>/dev/null || grep -q '^DATABASE_URL=postgresql' .env 2>/dev/null; then
              COMPOSE="$COMPOSE -f docker-compose.postgres.yml"
            fi

            $COMPOSE build api worker bot
            $COMPOSE up -d --remove-orphans
            $COMPOSE up -d caddy
            $COMPOSE restart caddy api bot

            # Health check with retries — give the stack up to 90s to come up.
            DOMAIN="${DOMAIN:-flacaud.ru}"
            HEALTH_OK=false
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf "https://${DOMAIN}/healthz" 2>/dev/null | grep -q '"ok": *true' \
                 || curl -sf http://127.0.0.1:8001/healthz 2>/dev/null | grep -q '"ok": *true'; then
                HEALTH_OK=true
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Health check attempt $i failed — retrying..."
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed after 60s — rolling back to $PREV_HEAD"
              git reset --hard "$PREV_HEAD"
              docker run --rm -v "$DEPLOY_PATH/frontend:/app" -w /app node:22-alpine sh -c "npm ci && npm run build"
              $COMPOSE build api worker bot
              $COMPOSE up -d --remove-orphans
              $COMPOSE restart caddy api bot
              sleep 15
              if curl -sf "https://${DOMAIN}/healthz" 2>/dev/null | grep -q '"ok": *true' \
                 || curl -sf http://127.0.0.1:8001/healthz 2>/dev/null | grep -q '"ok": *true'; then
                echo "Rollback successful — serving previous version ($PREV_HEAD)"
              else
                echo "ROLLBACK FAILED — manual intervention required"
              fi
              exit 1
            fi

            # Tag the successful deploy for auditability.
            git tag -f "deploy-$SHA" 2>/dev/null || true
            echo "Deployed $SHA successfully at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Started:** ${{ steps.meta.outputs.ts }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed to https://${DOMAIN:-flacaud.ru} and tagged \`deploy-${{ steps.meta.outputs.sha }}\` on the server." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy failed or rolled back — check the SSH step log for details." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          DOMAIN: ${{ vars.DOMAIN }}
