# Production overlay: TLS reverse proxy. Set DOMAIN in .env.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN for TLS}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

  api:
    # No host ports — only Caddy reaches api:8000 on the Docker network.
    # `!reset` is required: Compose *concatenates* port lists when merging files,
    # so a plain `ports: []` would NOT drop the base `${API_PORT}:8000` mapping —
    # api would still grab the host port and collide with Caddy on :80.
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
